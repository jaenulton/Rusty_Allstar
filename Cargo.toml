[workspace]
members = [
    "crates/iax2-proto",
    "crates/asl-dsp",
    "crates/asl-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Jae Nulton", "Rusty Allstar Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jaenulton/Rusty_Allstar"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
