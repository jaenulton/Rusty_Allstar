# Cargo Configuration for ESP32 Target Compilation

[unstable]
build-std = ["std", "panic_abort"]

[target.xtensa-esp32-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [
    "--cfg", "espidf_time_isr",
    "-C", "default-linker-libraries",
    "-C", "link-arg=--ldproxy-linker=xtensa-esp32-elf-gcc",
]

[target.riscv32imc-esp-espidf]
linker = "ldproxy"
runner = "espflash flash --monitor"
rustflags = [
    "-C", "default-linker-libraries",
    "-C", "link-arg=--ldproxy-linker=riscv32-esp-elf-gcc",
]

[env]
MCU = "esp32"
ESP_IDF_VERSION = "v5.2"
IDF_PYTHON_ENV_PATH = "/home/jae/.local/share/mise/shims/python3.10"
